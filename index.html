<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>_by : 76n</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.85)), 
                        url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ff003c;
        }

        .container {
            text-align: center;
            padding: 40px 30px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 0, 60, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.2);
            max-width: 450px;
            width: 90%;
            animation: fadeIn 1.5s ease-in-out;
        }

        .main-text {
            font-size: 2rem;
            font-weight: 900;
            color: #ff1a1a;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.8), 0 0 30px rgba(139, 0, 0, 0.6);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .sub-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: #e60000;
            text-shadow: 0 0 10px rgba(230, 0, 0, 0.7);
            direction: ltr;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="main-text">تم شخلكم الامور طيبه ياجماعة حياكم دسكورد</h1>
        <div class="sub-text">by : 76n_</div>
    </div>

    <!-- ملف الصوت المباشر -->
    <audio id="bg-music" loop autoplay preload="auto">
        <source src="7sn.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('bg-music');

        function playAudio() {
            audio.play().catch(() => {});
        }

        // محاولة تشغيل الصوت فوراً
        window.addEventListener('load', playAudio);
        
        // تشغيل مع أول حركة أو ضغطة تفاعلية في حال قيود المتصفح
        window.addEventListener('click', playAudio, { once: true });
        window.addEventListener('touchstart', playAudio, { once: true });
        window.addEventListener('scroll', playAudio, { once: true });
    </script>

</body>
</html>
